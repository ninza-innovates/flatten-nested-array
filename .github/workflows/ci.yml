name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          # Current Active LTS (Node.js 26, Lithium).
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
